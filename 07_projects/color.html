<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Color switch</title>


  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen">

  <h1 class="text-3xl font-bold mb-6">Color Switcher</h1>

  <div class="flex gap-4">
    
    <button id="grey" class="button w-16 h-16 bg-gray-500 rounded-lg"></button>
    
    <button id="blue" class="button w-16 h-16 bg-blue-500 rounded-lg"></button>
    
    <button id="green" class="button w-16 h-16 bg-green-500 rounded-lg"></button>
    
    <button id="red" class="button w-16 h-16 bg-red-500 rounded-lg"></button>

  </div>

</body>

<script>
const buttons = document.querySelectorAll('.button');
const body = document.querySelector('body');

buttons.forEach(function (button){

    button.addEventListener('click', function(e){

        if(e.target.id === 'grey'){
            body.style.backgroundColor = e.target.id;
        }

        if(e.target.id === 'blue'){
            body.style.backgroundColor = e.target.id;
        }

        if(e.target.id === 'green'){
            body.style.backgroundColor = e.target.id;
        }

        if(e.target.id === 'red'){
            body.style.backgroundColor = e.target.id;
        }

    })       

});
</script>

</html>
