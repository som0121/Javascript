<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bmi calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gray-900 text-white flex items-center justify-center h-screen"
  >
    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-[300px]">
      <h1 class="text-2xl font-bold mb-6 text-center">Bmi calculator</h1>

      <form>
        <div class="mb-4">
          <label class="block mb-1">Height in (cm)</label>
          <input
            type="text"
            id="height"
            class="w-full p-2 rounded bg-gray-700 text-white outline-none"
          />
        </div>

        <div class="mb-4">
          <label class="block mb-1">Weight (kg)</label>
          <input
            type="text"
            id="weight"
            class="w-full p-2 rounded bg-gray-700 text-white outline-none"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-green-500 hover:bg-green-600 transition p-2 rounded mt-2"
        >
          Calculate
        </button>
      </form>

      <div id="results" class="mt-4 text-center text-lg"></div>
    </div>
  </body>

  <script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const height = parseInt(document.querySelector("#height").value);
      const weight = parseInt(document.querySelector("#weight").value);
      const results = document.querySelector("#results");

      if (isNaN(height) || height <= 0) {
        results.innerHTML = `Please give a valid height`;
      } else if (isNaN(weight) || weight <= 0) {
        results.innerHTML = `Please give a valid weight`;
      } else {
        const bmi = (weight / ((height * height) / 10000)).toFixed(2);

        let category = "";

        if (bmi < 18.6) {
          category = "Underweight";
        } else if (bmi >= 18.6 && bmi <= 24.9) {
          category = "Normal";
        } else {
          category = "Overweight";
        }

        results.innerHTML = `
            <span>Your BMI is: ${bmi}</span><br>
            <span>Category: ${category}</span>
        `;
      }
    });
  </script>
</html>
