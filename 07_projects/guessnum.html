<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the number Game</title>

    <!Tailwind>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gray-900 text-white flex items-center justify-center h-screen"
  >
    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-[350px] text-center">
      <h1 class="text-2xl font-bold mb-4">Guess the number game</h1>
      <p class="mb-4 text-sm text-gray-300">Guess a number between 1 and 100</p>

      <form>
        <input
          type="text"
          id="guessField"
          class="w-full p-2 rounded bg-gray-700 text-white mb-4 outline-none"
          placeholder="Enter number"
        />

        <button
          id="subt"
          class="w-full bg-green-500 hover:bg-green-600 p-2 rounded transition"
        >
          Submit Guess
        </button>
      </form>

      <div class="resultParas mt-6">
        <p>Previous guesses: <span class="guesses"></span></p>
        <p>Guesses remaining: <span class="lastResult">10</span></p>
        <p class="lowerHi mt-2 text-lg"></p>
      </div>
    </div>
  </body>

  <script>
    let randomNumber = parseInt(Math.random() * 100 + 1);

    const submit = document.querySelector("#subt");
    const userInput = document.querySelector("#guessField");
    const guessSlot = document.querySelector(".guesses");
    const remaining = document.querySelector(".lastResult");
    const lowerHi = document.querySelector(".lowerHi");
    const startOver = document.querySelector(".resultParas");

    const p = document.createElement("p");

    let prevGuess = [];
    let numGuess = 1;

    let playGame = true;

    if (playGame) {
      submit.addEventListener("click", function (e) {
        e.preventDefault();

        const guess = parseInt(userInput.value);
        validateGuess(guess);
      });
    }

    function validateGuess(guess) {
      if (isNaN(guess)) {
        alert("Please enter a valid number");
      } else if (guess < 1) {
        alert("Please enter a number greater than 1");
      } else if (guess > 100) {
        alert("Please enter a number less than 100");
      } else {
        prevGuess.push(guess);

        if (numGuess === 11) {
          displayGuess(guess);
          displayMessage(`Game over. Number was ${randomNumber}`);
          endGame();
        } else {
          displayGuess(guess);
          checkGuess(guess);
        }
      }
    }

    function checkGuess(guess) {
      if (guess === randomNumber) {
        displayMessage(`You guessed it right!`);
        endGame();
      } else if (guess < randomNumber) {
        displayMessage(`The number is too low`);
      } else {
        displayMessage(` The number is too high`);
      }
    }

    function displayGuess(guess) {
      userInput.value = "";
      guessSlot.innerHTML += `${guess}, `;
      numGuess++;
      remaining.innerHTML = `${10 - numGuess}`;
    }

    function displayMessage(message) {
      lowerHi.innerHTML = `<h2>${message}</h2>`;
    }

    function endGame() {
      userInput.value = "";
      userInput.setAttribute("disabled", "");

      p.classList.add("mt-4", "cursor-pointer", "text-blue-400");
      p.innerHTML = `<h2 id="newGame">Start New Game</h2>`;

      startOver.appendChild(p);

      playGame = false;
      newGame();
    }

    function newGame() {
      const newGameButton = document.querySelector("#newGame");

      newGameButton.addEventListener("click", function () {
        randomNumber = parseInt(Math.random() * 100 + 1);
        prevGuess = [];
        numGuess = 1;

        guessSlot.innerHTML = "";
        remaining.innerHTML = `10`;

        userInput.removeAttribute("disabled");
        startOver.removeChild(p);

        playGame = true;
      });
    }
  </script>
</html>
