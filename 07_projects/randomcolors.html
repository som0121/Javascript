<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Random bg color changer</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gray-900 text-white flex items-center justify-center h-screen"
  >
    <div class="bg-gray-800 p-8 rounded-2xl shadow-xl text-center w-[350px]">
      <h1 class="text-2xl font-bold mb-6">Random Background Color Changer</h1>

      <div class="flex justify-center gap-4">
        <button
          id="start"
          class="bg-green-500 hover:bg-green-600 px-6 py-2 rounded-lg transition"
        >
          Start
        </button>

        <button
          id="stop"
          class="bg-red-500 hover:bg-red-600 px-6 py-2 rounded-lg transition"
        >
          Stop
        </button>
      </div>
    </div>
  </body>

  <script>
    const randomColor = function () {
      const hex = "0123456789ABCDEF";
      let color = "#";

      for (let i = 0; i < 6; i++) {
        color += hex[Math.floor(Math.random() * 16)];
      }

      return color;
    };

    let intervalId = null;

    const startChangingColor = function () {
      if (!intervalId) {
        intervalId = setInterval(changeBgColor, 1000);
      }

      function changeBgColor() {
        document.body.style.backgroundColor = randomColor();
      }
    };

    const stopChangingColor = function () {
      clearInterval(intervalId);
      intervalId = null;
    };

    document
      .querySelector("#start")
      .addEventListener("click", startChangingColor);
    document
      .querySelector("#stop")
      .addEventListener("click", stopChangingColor);
  </script>
</html>
